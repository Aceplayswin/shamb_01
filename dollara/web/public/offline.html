<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #e8edf2;
        background: #0b0f14;
        text-align: center;
      }
      .card { max-width: 340px; }
      .badge {
        width: 84px; height: 84px; margin: 0 auto 22px;
        display: grid; place-items: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #ffc942, #f28d0c);
        box-shadow: 0 12px 40px rgba(242, 141, 12, 0.35);
      }
      .badge svg { width: 40px; height: 40px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 800; }
      p { margin: 0 0 22px; color: #9aa6b2; font-size: 0.95rem; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        font: inherit; font-weight: 700;
        padding: 12px 26px; border-radius: 12px;
        color: #0b0f14;
        background: linear-gradient(135deg, #ffc942, #f28d0c);
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0b0f14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>We couldn't reach the network. Check your connection and try again — the app will pick up right where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
